<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<style>
  .input-error {
    border: 2px solid red;
  }
</style>

<body>
  <div class="container">
    <div class="loadText">Комментарии загружаюсться, подождите....</div>

    <ul class="comments">

    </ul>
    <div class="loadTextComment">Комментарий добавляется, подождите....</div>
    <div class="add-form">
      <input type="text" class="add-form-name" placeholder="Введите ваше имя" />
      <textarea type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button">Написать</button>
      </div>
    </div>
    <div class="autorisationForm">
      <button class="loginButton button">Войти</button>
      <button class="regButton button">Зарегистрироваться</button>
      
    </div>
    <div id="myModal" class="modal">
     <div class="modal-content">
       <span class="close">&times;</span>
       <h1>Вход</h1>
       <input class="autorisaton-name" type="text" id="username" placeholder="Введите ваше имя" />
       <input class="autorisaton-password" type="password" id="password" placeholder="Введите пароль" />
       <div id="authError"></div>
       <button class="button" id="submitLogin">Войти</button>
     </div>
   </div>
  </div>
</body>

<script type="module" src="./index.js">
</script>
